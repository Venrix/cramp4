name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          flutter build windows --release --build-name=$version --build-number=${{ github.run_number }}

      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DAppVersion=$version

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -Path build\windows\x64\runner\Release\.portable -ItemType File -Force
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath build\windows\installer\cramp4-${{ github.ref_name }}-windows-portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: |
            build/windows/installer/cramp4-*-windows-setup.exe
            build/windows/installer/cramp4-*-windows-portable.zip

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          flutter build linux --release --build-name="$version" --build-number=${{ github.run_number }}

      - name: Package tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../cramp4-${{ github.ref_name }}-linux-x64.tar.gz .

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p AppDir
          cp -r build/linux/x64/release/bundle/. AppDir/
          cp linux/appimage/cramp4.desktop AppDir/
          cp linux/appimage/cramp4.png AppDir/
          cp linux/appimage/AppRun AppDir/
          chmod +x AppDir/AppRun AppDir/cramp4
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir cramp4-${{ github.ref_name }}-linux-x64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            cramp4-*-linux-x64.tar.gz
            cramp4-*-linux-x64.AppImage

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          path: artifacts/

      - uses: actions/download-artifact@v8
        with:
          name: linux-artifacts
          path: artifacts/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          generate_release_notes: true
