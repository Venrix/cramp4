name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          flutter build windows --release --build-name=$version --build-number=${{ github.run_number }}

      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DAppVersion=$version

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath build\windows\installer\cramp4-${{ github.ref_name }}-windows-portable.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/windows/installer/cramp4-*-windows-setup.exe
            build/windows/installer/cramp4-*-windows-portable.zip
          generate_release_notes: true
